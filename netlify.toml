[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# Prerendered language versions (dist/en/index.html, dist/pt/index.html)
# are served automatically. Normalize missing trailing slash.
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/pt"
  to = "/pt/"
  status = 301

[[redirects]]
  from = "/planemprendedor"
  to = "/planemprendedor/"
  status = 301

# Ruta anterior de la landing (links ya compartidos o en anuncios)
[[redirects]]
  from = "/web-en-5-dias"
  to = "/planemprendedor/"
  status = 301

[[redirects]]
  from = "/web-en-5-dias/*"
  to = "/planemprendedor/"
  status = 301

# No SPA catch-all: unknown URLs get the real 404.html with a 404 status
# instead of a soft-404 (200 + homepage).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
