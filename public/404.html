<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — Nilotech</title>
  <link rel="icon" type="image/png" href="/images/icon-192.png" />
  <meta name="theme-color" content="#09090B" />
  <style>
    html, body { margin: 0; height: 100%; background: #09090B; color: #E4E4E7; font-family: Inter, system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .code { font-family: ui-monospace, 'JetBrains Mono', monospace; color: #FFD200; letter-spacing: .2em; font-size: 14px; margin-bottom: 16px; }
    h1 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 16px; color: #fff; letter-spacing: -.02em; }
    p { color: #A1A1AA; max-width: 420px; line-height: 1.6; margin: 0 0 32px; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a { color: #09090B; background: #FFD200; padding: 12px 24px; border-radius: 999px; text-decoration: none; font-weight: 600; }
    a.ghost { background: transparent; color: #E4E4E7; border: 1px solid rgba(255,255,255,.12); }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté roto o que la página se haya movido.</p>
    <nav>
      <a href="/">Volver al inicio</a>
      <a class="ghost" href="/#contact">Contacto</a>
      <a class="ghost" href="/en/">English</a>
      <a class="ghost" href="/pt/">Português</a>
    </nav>
  </main>
</body>
</html>
